<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythic Mosaic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <h1>Mythic Mosaic</h1>
    <p class="count"><span id="found-count">0</span> / <span id="found-total">6</span> 匹</p>
  </header>

  <div class="stage">
    <svg id="board" role="img" aria-label="箱庭の島"></svg>
    <p id="chain" class="chain" aria-hidden="true"></p>
  </div>

  <div id="log" class="log" aria-live="polite"></div>

  <div class="palette" role="group" aria-label="置く物"></div>

  <nav class="tools">
    <button type="button" id="undo">1手戻す</button>
    <button type="button" id="clear">更地にする</button>
    <button type="button" id="open-book">図鑑</button>
    <button type="button" id="open-help">遊び方</button>
  </nav>

  <p class="version">試作 版 <span id="version"></span></p>
</main>

<dialog id="book">
  <h2>図鑑</h2>
  <ol id="book-list" class="book"></ol>
  <form method="dialog"><button>閉じる</button></form>
</dialog>

<dialog id="help">
  <h2>遊び方（試作）</h2>
  <ol class="help">
    <li>下で置く物を選び、島のマスを押して置く。</li>
    <li>ある形ができると、幻の生き物がすぐ現れて中心のマスに住む。</li>
    <li>現れた生き物は周りの土地を変える。変わった所で次の形ができると連鎖する。</li>
    <li>見つけた生き物は図鑑に残る。見つける前は一言だけ分かる。</li>
    <li>生き物を3匹見つけると、丘が置けるようになり、島が37マスに広がる。</li>
  </ol>
  <p class="help-note">生き物の居るマスには置けない。地面を置くと木は消え、高さは残る。同じ種類の生き物は、1回の連鎖で1つの段にしか出ない。</p>
  <form method="dialog" class="help-actions">
    <button>閉じる</button>
    <button type="button" id="reset" class="danger">記録を全部消す</button>
  </form>
</dialog>

<script type="module" src="src/ui/main.js"></script>
</body>
</html>
